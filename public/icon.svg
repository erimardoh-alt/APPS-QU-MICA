<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="50%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="flaskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer subtle glow ring -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#2dd4bf" stroke-opacity="0.25" stroke-width="4" />

  <!-- Hexagonal molecular ring -->
  <polygon points="256,76 392,154 392,312 256,390 120,312 120,154" fill="none" stroke="#2dd4bf" stroke-width="6" stroke-opacity="0.4" stroke-dasharray="12 8" />

  <!-- Glowing chemical Erlenmeyer Flask -->
  <path d="M 232,140 L 280,140 L 280,180 L 340,300 C 352,324 340,344 316,344 L 196,344 C 172,344 160,324 172,300 L 232,180 Z" 
        fill="url(#flaskGrad)" stroke="#2dd4bf" stroke-width="8" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Flask Neck Lip -->
  <rect x="220" y="128" width="72" height="16" rx="6" fill="#14b8a6" />

  <!-- Effervescent bubbles (CO2 release) inside flask -->
  <circle cx="256" cy="316" r="14" fill="#ffffff" fill-opacity="0.9" />
  <circle cx="228" cy="284" r="10" fill="#a7f3d0" fill-opacity="0.8" />
  <circle cx="276" cy="270" r="12" fill="#5eead4" fill-opacity="0.85" />
  <circle cx="246" cy="240" r="8" fill="#ffffff" fill-opacity="0.9" />
  <circle cx="266" cy="210" r="6" fill="#99f6e4" fill-opacity="0.8" />

  <!-- Formula badge text at bottom -->
  <rect x="136" y="380" width="240" height="64" rx="20" fill="#031b1a" stroke="#2dd4bf" stroke-width="3" />
  <text x="256" y="424" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="34" fill="#5eead4" text-anchor="middle" letter-spacing="2">
    NaHCO₃
  </text>
</svg>
